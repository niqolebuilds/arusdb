<title>ARUS Leakage Exposure Map</title>
<style id="app-style">
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#f5f2ea;
    --surface:#fffdf8;
    --surface-2:#eee9dc;
    --ink:#1d2430;
    --ink-2:#565c6b;
    --muted:#8b8f80;
    --hairline:#dcd6c4;
    --accent:#a8621f;
    --accent-ink:#fffaf1;
    --accent-wash:#f1e2cd;
    --link:#2c5a86;

    --good:#0ca30c;
    --warning:#b1780a;
    --serious:#c25a2e;
    --critical:#a3312f;
    --good-wash:#e4f3e0;
    --warning-wash:#faeed2;
    --serious-wash:#f7e2d5;
    --critical-wash:#f4dcda;

    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#c98500; --s5:#e87ba4;

    --shadow: 0 1px 2px rgba(29,36,48,0.06), 0 8px 24px -12px rgba(29,36,48,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171c;
      --surface:#1b1f26;
      --surface-2:#232833;
      --ink:#eeece3;
      --ink-2:#b7bac4;
      --muted:#8a8f9c;
      --hairline:#323847;
      --accent:#e0a35e;
      --accent-ink:#241505;
      --accent-wash:#3a2c17;
      --link:#8fb8de;

      --good:#4fbf5a;
      --warning:#e0a83c;
      --serious:#e08a5d;
      --critical:#e2726f;
      --good-wash:#1c2c1c;
      --warning-wash:#332a15;
      --serious-wash:#332019;
      --critical-wash:#331b1a;

      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171c;
    --surface:#1b1f26;
    --surface-2:#232833;
    --ink:#eeece3;
    --ink-2:#b7bac4;
    --muted:#8a8f9c;
    --hairline:#323847;
    --accent:#e0a35e;
    --accent-ink:#241505;
    --accent-wash:#3a2c17;
    --link:#8fb8de;

    --good:#4fbf5a;
    --warning:#e0a83c;
    --serious:#e08a5d;
    --critical:#e2726f;
    --good-wash:#1c2c1c;
    --warning-wash:#332a15;
    --serious-wash:#332019;
    --critical-wash:#331b1a;

    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    font-size:15px; line-height:1.5;
  }
  h1,h2,h3{ font-family:"Source Serif 4", Georgia, serif; font-weight:600; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{ color:var(--link); }

  #app{ max-width:1180px; margin:0 auto; padding:28px 24px 80px; }

  /* ---------- header ---------- */
  .masthead{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:20px;
    flex-wrap:wrap;
  }
  .masthead .eyebrow{
    font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:6px; display:block;
  }
  .masthead h1{ font-size:30px; }
  .masthead .meta{ text-align:right; font-size:12.5px; color:var(--ink-2); }
  .masthead .meta strong{ color:var(--ink); }

  /* ---------- flag banner ---------- */
  .flag{
    display:flex; gap:14px; align-items:flex-start;
    background:var(--critical-wash); border:1px solid var(--critical);
    border-radius:10px; padding:14px 16px; margin-bottom:22px;
  }
  .flag .glyph{
    flex:none; width:28px; height:28px; border-radius:50%; background:var(--critical); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-family:"IBM Plex Mono";
    font-size:15px;
  }
  .flag h2{ font-size:15.5px; font-family:"IBM Plex Sans"; font-weight:700; margin-bottom:3px; }
  .flag p{ margin:0; font-size:13.5px; color:var(--ink-2); max-width:78ch; }

  /* ---------- kpi row ---------- */
  .kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--hairline);
    border:1px solid var(--hairline); border-radius:10px; overflow:hidden; margin-bottom:26px; }
  .kpi{ background:var(--surface); padding:14px 16px; }
  .kpi .num{ font-family:"Source Serif 4"; font-size:26px; font-weight:600; line-height:1.1; }
  .kpi .num small{ font-size:14px; font-weight:500; color:var(--ink-2); }
  .kpi .label{ font-size:11.5px; color:var(--ink-2); margin-top:4px; }
  .kpi.warn .num{ color:var(--critical); }

  /* ---------- distribution chart ---------- */
  .panel{ background:var(--surface); border:1px solid var(--hairline); border-radius:12px;
    padding:18px 20px; margin-bottom:26px; box-shadow:var(--shadow); }
  .panel h3{ font-size:15px; margin-bottom:2px; }
  .panel .sub{ font-size:12.5px; color:var(--ink-2); margin-bottom:14px; }
  .dist-row{ display:grid; grid-template-columns:150px 1fr 34px; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px;}
  .dist-track{ display:flex; height:16px; border-radius:4px; overflow:hidden; background:var(--surface-2); }
  .dist-seg{ height:100%; }
  .dist-total{ text-align:right; color:var(--ink-2); }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-2); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab{
    font-family:"IBM Plex Mono"; font-size:12px; padding:8px 13px; border-radius:999px;
    border:1px solid var(--hairline); background:var(--surface); color:var(--ink-2); cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .tab .n{ background:var(--surface-2); border-radius:999px; padding:1px 6px; font-size:11px; }
  .tab.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .tab.active .n{ background:rgba(255,255,255,0.18); color:var(--paper); }
  .tab:hover:not(.active){ border-color:var(--accent); color:var(--ink); }

  /* ---------- lob group ---------- */
  .lob-group{ margin-bottom:30px; }
  .lob-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .lob-head .swatch{ width:11px; height:11px; border-radius:3px; }
  .lob-head h2{ font-size:19px; }
  .lob-head .count{ font-size:12.5px; color:var(--ink-2); }
  .lob-desc{ font-size:12.5px; color:var(--ink-2); margin:0 0 12px; max-width:90ch; }

  table.reg{ width:100%; border-collapse:collapse; font-size:13px; }
  table.reg th{
    text-align:left; font-family:"IBM Plex Mono"; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); font-weight:600; padding:7px 10px; border-bottom:1px solid var(--hairline);
  }
  table.reg td{ padding:9px 10px; border-bottom:1px solid var(--hairline); vertical-align:top; }
  table.reg tbody tr:hover{ background:var(--surface-2); }
  .fid{ font-family:"IBM Plex Mono"; font-weight:600; font-size:12px; white-space:nowrap; }
  .finding-cell .f-title{ font-weight:500; }
  .finding-cell .f-sys{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .score-cell{ width:74px; }
  .score-num{
    font-family:"Source Serif 4"; font-size:19px; font-weight:700; line-height:1.05;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  }
  .score-num.unscored{ color:var(--muted); font-family:"IBM Plex Mono"; font-size:15px; }
  .score-detail{
    font-family:"IBM Plex Mono"; font-size:10.5px; color:var(--muted); margin-top:1px;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; white-space:nowrap;
  }
  .band-pill{
    font-family:"IBM Plex Mono"; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px;
    display:inline-block; white-space:nowrap; text-transform:uppercase; letter-spacing:.03em;
  }
  .band-pill.unscored{ background:var(--surface-2); color:var(--muted); border:1px dashed var(--hairline); }
  .exposure-badge{
    font-size:11.5px; padding:3px 8px; border-radius:6px; display:inline-block; max-width:180px;
  }
  .exposure-badge.known{ background:var(--good-wash); color:var(--good); font-weight:600; }
  .exposure-badge.estimated{ background:var(--warning-wash); color:var(--warning); font-weight:600; }
  .exposure-badge.rate{ background:var(--warning-wash); color:var(--warning); font-weight:600; }
  .exposure-badge.none{ background:var(--surface-2); color:var(--muted); border:1px dashed var(--hairline); }

  .notes-btn{
    font-family:"IBM Plex Mono"; font-size:11px; background:none; border:1px solid var(--hairline);
    border-radius:6px; padding:4px 8px; color:var(--ink-2); cursor:pointer;
  }
  .notes-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .notes-btn.has-note{ border-color:var(--accent); color:var(--accent); background:var(--accent-wash); }
  tr.note-row td{ padding:0 10px 14px; border-bottom:1px solid var(--hairline); background:var(--surface-2); }
  tr.note-row.hidden{ display:none; }
  .note-box{ padding:10px 2px 2px; }
  .note-box textarea{
    width:100%; min-height:64px; resize:vertical; font-family:"IBM Plex Sans"; font-size:13px;
    border:1px solid var(--hairline); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--ink);
  }
  .note-box .note-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .note-meta{ font-size:11px; color:var(--muted); }
  .save-btn{
    font-family:"IBM Plex Mono"; font-size:11.5px; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:6px; padding:6px 12px; cursor:pointer; font-weight:600;
  }
  .save-btn:disabled{ opacity:.5; cursor:default; }
  .save-status{ font-size:11px; color:var(--good); margin-left:8px; }

  .evidence{ font-size:12px; color:var(--ink-2); font-style:italic; margin-top:3px; }

  /* ---------- quick exposure estimator ---------- */
  .estimator .est-form{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:end; margin-bottom:16px;
  }
  .estimator .est-form label{
    display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--ink-2);
    font-family:"IBM Plex Mono"; text-transform:uppercase; letter-spacing:.03em;
  }
  .estimator .est-form label:nth-child(2){ grid-column:span 2; }
  .estimator input, .estimator select{
    font-family:"IBM Plex Sans"; font-size:13px; padding:7px 9px; border:1px solid var(--hairline);
    border-radius:7px; background:var(--surface); color:var(--ink); text-transform:none; letter-spacing:normal;
  }
  .estimator .est-form #est-calc{ width:100%; padding:8px 12px; }
  table.est-table td:nth-child(2){ white-space:normal; min-width:170px; }
  .est-del{
    font-family:"IBM Plex Mono"; font-size:11px; background:none; border:1px solid var(--hairline);
    border-radius:6px; padding:2px 7px; color:var(--muted); cursor:pointer;
  }
  .est-del:hover{ border-color:var(--critical); color:var(--critical); }

  .tag-row{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .lob-badge{
    font-family:"IBM Plex Mono"; font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px;
    background:var(--surface-2); color:var(--ink-2); border:1px solid var(--hairline); white-space:nowrap;
  }
  .lob-badge.cross{ font-style:italic; color:var(--muted); }
  .lob-badge.inferred{ border-style:dashed; }
  .los-badge{
    font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; white-space:nowrap;
    background:var(--accent-wash); color:var(--accent); border:1px solid transparent;
  }
  .source-tag{ font-size:11px; color:var(--muted); }

  .rel-badge{
    font-size:10px; font-weight:600; padding:1px 7px; border-radius:4px; white-space:nowrap;
    display:inline-block; letter-spacing:.02em;
  }
  .rel-badge.leakage{ background:var(--critical-wash); color:var(--critical); }
  .rel-badge.adjacent{ background:var(--warning-wash); color:var(--warning); }
  .rel-badge.not-leakage{ background:var(--surface-2); color:var(--ink-2); border:1px solid var(--hairline); }

  .unconfirmed-badge{
    font-family:"IBM Plex Mono"; font-size:10px; font-weight:600; padding:1px 7px; border-radius:4px;
    background:transparent; color:var(--accent); border:1px dashed var(--accent); white-space:nowrap;
  }
  tr.reg-row.unconfirmed{ background:linear-gradient(90deg, var(--accent-wash) 0%, transparent 3%); }

  .rel-panel-row{ display:grid; grid-template-columns:170px 60px 1fr; gap:12px; align-items:baseline; margin-bottom:9px; font-size:12.5px; }
  .rel-panel-row .n{ font-family:"Source Serif 4"; font-weight:700; font-size:17px; }
  .rel-panel-row .d{ color:var(--ink-2); }

  .empty-state{
    border:1px dashed var(--hairline); border-radius:10px; padding:20px 18px; text-align:center;
    color:var(--ink-2); font-size:13px; background:var(--surface-2);
  }
  .empty-state strong{ color:var(--ink); display:block; margin-bottom:4px; font-family:"Source Serif 4"; font-size:15px; }

  footer{ margin-top:36px; padding-top:16px; border-top:1px solid var(--hairline); font-size:11.5px; color:var(--muted); }

  @media (max-width:820px){
    .kpis{ grid-template-columns:repeat(2,1fr); }
    table.reg thead{ display:none; }
    table.reg, table.reg tbody, table.reg tr, table.reg td{ display:block; width:100%; }
    table.reg tr{ border-bottom:1px solid var(--hairline); padding:8px 0; }
    table.reg td{ border:none; padding:3px 0; }
    .estimator .est-form{ grid-template-columns:1fr 1fr; }
    .estimator .est-form label:nth-child(2){ grid-column:span 2; }
  }
  .scroll-wrap{ overflow-x:auto; }
</style>

};

function band(score){
  if(score==null) return {label:"Unscored", css:"unscored"};
  if(score>=12) return {label:"High", css:"critical"};
  if(score>=6) return {label:"Moderate", css:"warning"};
  return {label:"Low", css:"good"};
}
ALL_ITEMS.forEach(function(it){
  if(it.confirmed===undefined) it.confirmed = true;
  it.score = (it.L!=null && it.I!=null) ? it.L*it.I : null;
  it.band = band(it.score);
});

var LOBS = LOB_DEFS.map(function(d){
  return {
    key:d.key, name:d.name,
    items: ALL_ITEMS.filter(function(it){ return it.lob.indexOf(d.key) !== -1; })
  };
});

var TOTAL = ALL_ITEMS.length;
var QUANT = ALL_ITEMS.filter(function(i){ return i.exp==="known"; }).length;
var PARTIAL = ALL_ITEMS.filter(function(i){ return i.exp==="estimated"||i.exp==="rate"; }).length;
var NONE = TOTAL - QUANT - PARTIAL;
var HIGH = ALL_ITEMS.filter(function(i){ return i.band.label==="High"; }).length;
var UNASSESSED = LOBS.filter(function(g){ return g.items.length===0; }).map(function(g){ return g.name; });

var UNCONFIRMED_COUNT = TOTAL - CONFIRMED_ITEMS.length;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtNum(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('id-ID',{maximumFractionDigits:2}); }
function fmtRp(n){ return (n==null||isNaN(n)) ? '—' : 'Rp '+Number(Math.round(n)).toLocaleString('id-ID'); }

function estimatorHTML(){
  var ests = Object.keys(state.estimates).map(function(k){ return state.estimates[k]; });
  ests.sort(function(a,b){ return (b.exposure||0)-(a.exposure||0); });
  var itemOptions = ALL_ITEMS.map(function(it){
    var short = it.finding.length>54 ? it.finding.slice(0,54)+'…' : it.finding;
    return '<option value="'+it.id+'">'+it.id+' — '+esc(short)+'</option>';
  }).join("");
  var rows = ests.length ? ests.map(function(e){
    return '<tr>'+
      '<td class="fid">'+esc(e.itemId||'—')+'</td>'+
      '<td>'+esc(e.label)+(e.period?'<div class="f-sys">'+esc(e.period)+'</div>':'')+'</td>'+
      '<td class="mono" style="text-align:right;">'+fmtNum(e.universe)+'</td>'+

    '</tr>';
  }).join("") : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:18px;">No quick estimates yet — fill in the calculator above to size and rank your first pinpoint.</td></tr>';

  return '<div class="panel estimator">'+
    '<h3>Quick Exposure Estimator</h3>'+
    '<div class="sub">Size a pinpoint from a handful of numbers instead of pulling bulk transaction data, then rank candidates to decide which ones justify a full transaction-level pull. '+
      '<strong>Gap volume</strong> = Universe (what should have been billed) − Actually billed, netted down by any known legitimate-exception rate (e.g. entitled class upgrades that are not leakage). '+
      '<strong>Estimated exposure</strong> = net gap volume × unit rate (ARPP, tariff, or unit price). Directional, not audit-grade — a fast triage ranking, not a substitute for the transaction pull once a pinpoint is prioritized.</div>'+

      '<label>Tie to register item (optional)<select id="est-item"><option value="">— none / other —</option>'+itemOptions+'</select></label>'+

      '<label>Actually billed (volume)<input id="est-billed" type="number" step="any" placeholder="e.g. 600"></label>'+
      '<label>Known legitimate exceptions (%)<input id="est-exception" type="number" step="any" placeholder="0"></label>'+
      '<label>Unit rate (Rp)<input id="est-rate" type="number" step="any" placeholder="e.g. 150000"></label>'+
      '<label>Period label (optional)<input id="est-period" type="text" placeholder="e.g. per month, SHLV"></label>'+
      '<label style="justify-content:flex-end;"><button class="save-btn" id="est-calc" type="button">Calculate &amp; save</button></label>'+
    '</div>'+
    '<div class="scroll-wrap">'+
    '<table class="reg est-table">'+
      '<thead><tr><th>Item</th><th>Label</th><th style="text-align:right;">Universe</th><th style="text-align:right;">Billed</th><th style="text-align:right;">Capture</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Est. exposure</th><th></th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table></div>'+
  '</div>';
}

      PARTIAL+' more have a rate or an order-of-magnitude estimate, not a case-level Rp figure. The remaining '+NONE+' are risk-scored only — flagged per row below. '+
      'Not every row is actually revenue leakage either: only <strong>'+LEAK_COUNT+' of '+TOTAL+'</strong> are billed-vs-performed gaps — see the relevance breakdown below for the '+ADJ_COUNT+' adjacent and '+NOTLEAK_COUNT+' non-leakage items mixed into the same register. '+
      'This pass also adds <strong>'+UNCONFIRMED_COUNT+' unconfirmed potentials</strong> (marked with a dashed “Unconfirmed” tag) — real leakage hypotheses the deck names for OT, Cath Lab, Dialysis, Chemo, ICU, Endoscopy, Nursing and general Inpatient, none of which have had an SME round yet, so they carry no score, only the deck’s own Dampak/Probabilitas words. '+
      (unassessedTxt? '<strong>'+esc(unassessedTxt)+'</strong> is still genuinely empty even after adding those. ' : '')+
      'Treat every score as directional until the quantification pilot (Wave 1) produces measured Rp.</p>'+
    '</div>'+
  '</div>';
}

function relevanceHTML(){
  var order = ["leakage","adjacent","not-leakage"];
  var counts = {leakage:LEAK_COUNT, adjacent:ADJ_COUNT, "not-leakage":NOTLEAK_COUNT};
  var rows = order.map(function(k){
    var m = RELEVANCE_META[k];
    return '<div class="rel-panel-row">'+
      '<div><span class="rel-badge '+m.css+'">'+esc(m.label)+'</span></div>'+
      '<div class="n">'+counts[k]+'</div>'+
      '<div class="d">'+esc(m.desc)+'</div>'+
    '</div>';
  }).join("");
  return '<div class="panel">'+
    '<h3>Is this actually revenue leakage?</h3>'+
    '<div class="sub">Every row in the register below carries this tag. Reviewed against the definition used elsewhere in this deck: a service or item was delivered but never charged, or charged under tariff.</div>'+
    rows+
  '</div>';
}

function distributionHTML(){
  var rows = LOBS.map(function(g){
    var n = g.items.length;
    if(!n){
      return '<div class="dist-row"><div>'+esc(g.name)+'</div><div class="dist-track"></div><div class="dist-total" style="color:var(--muted);font-style:italic;">none</div></div>';
    }
    var high = g.items.filter(function(i){return i.band.label==="High";}).length;
    var mod = g.items.filter(function(i){return i.band.label==="Moderate";}).length;
    var low = g.items.filter(function(i){return i.band.label==="Low";}).length;
    var unsc = g.items.filter(function(i){return i.band.label==="Unscored";}).length;
    function seg(count,color){ return count? '<div class="dist-seg" style="width:'+(count/n*100)+'%;background:'+color+'"></div>' : ''; }
    return '<div class="dist-row"><div>'+esc(g.name)+'</div>'+
      '<div class="dist-track">'+seg(high,'var(--critical)')+seg(mod,'var(--warning)')+seg(low,'var(--good)')+seg(unsc,'var(--hairline)')+'</div>'+
      '<div class="dist-total">'+n+'</div></div>';
  }).join("");
  return '<div class="panel">'+
    '<h3>Risk-score distribution by line of business</h3>'+
    '<div class="sub">A finding tied to two settings (e.g. Ph11, Ph17) counts in both — LOB totals here don’t sum to '+TOTAL+'. Likelihood × Impact band only, not dollar-weighted (see exposure column below for what is and isn’t priced).</div>'+
    rows+
    '<div class="legend">'+
      '<span><i style="background:var(--critical)"></i>High (score ≥12)</span>'+
      '<span><i style="background:var(--warning)"></i>Moderate (6–11)</span>'+
      '<span><i style="background:var(--good)"></i>Low (≤5)</span>'+
      '<span><i style="background:var(--hairline)"></i>Unscored (unconfirmed potential)</span>'+
    '</div>'+
  '</div>';
}

function tabsHTML(){
  var t = ['<div class="tabs">'];
  t.push('<div class="tab '+(state.activeTab==="all"?"active":"")+'" data-tab="all">All LOBs <span class="n">'+TOTAL+'</span></div>');
  LOBS.forEach(function(g){
    t.push('<div class="tab '+(state.activeTab===g.key?"active":"")+'" data-tab="'+g.key+'">'+esc(g.name)+' <span class="n">'+g.items.length+'</span></div>');
  });
  t.push('</div>');
  return t.join("");
}

function exposureBadge(it){
  var cls = it.exp === "known" ? "known" : (it.exp === "none" ? "none" : it.exp);
  var label = it.exp === "known" ? "Quantified" : (it.exp === "none" ? "Not quantified" : "Not priced");
  var title = it.expVal || EXPOSURE_LABEL[it.exp];
  return '<span class="exposure-badge '+cls+'" title="'+esc(title)+'">'+esc(label)+'</span>'+
    (it.expVal? '<div class="evidence" style="margin-top:4px;max-width:220px;">'+esc(it.expVal)+'</div>' : '');
}

function lobTagsHTML(it){
  return '<div class="tag-row">'+
    it.lob.map(function(k){
      var d = LOB_DEFS.filter(function(x){return x.key===k;})[0];
      var label = k==="CROSS" ? "Cross-LOB" : k;
      return '<span class="lob-badge '+(k==="CROSS"?"cross":"")+' '+(it.lobInferred?"inferred":"")+'" title="'+esc((it.lobInferred?"Inferred from context — not source-tagged. ":"")+(d?d.name:label))+'">'+esc(label)+'</span>';
    }).join("")+
    (it.los? '<span class="los-badge">LOS: '+esc(it.los)+'</span>' : '')+
  '</div>';
}

function relBadgeHTML(it){
  var m = RELEVANCE_META[it.relevance];
  if(!m) return '';
  return '<span class="rel-badge '+m.css+'" title="'+esc(m.desc+(it.relNote?' — '+it.relNote:''))+'">'+esc(m.label)+'</span>';
}

function scoreCellHTML(it){
  if(it.score==null){
    return '<td class="score-cell"><div class="score-num unscored">—</div>'+
      '<div class="score-detail">P:'+esc(it.probLabel||'?')+' · I:'+esc(it.impactLabel||'?')+'</div></td>';
  }
  return '<td class="score-cell"><div class="score-num" style="color:var(--'+it.band.css+')">'+it.score+'</div>'+
    '<div class="score-detail">L'+it.L+' × I'+it.I+'</div></td>';
}

function rowHTML(it){
  var hasNote = state.notes[it.id] && state.notes[it.id].text;
  var open = openNoteId === it.id;
  return ''+
  '<tr class="reg-row'+(it.confirmed===false?" unconfirmed":"")+'" data-id="'+it.id+'">'+
    '<td class="fid">'+it.id+'</td>'+
    '<td class="finding-cell"><div class="f-title">'+esc(it.finding)+
      (it.confirmed===false? ' <span class="unconfirmed-badge">Unconfirmed</span>' : '')+
      '</div>'+
      '<div class="f-sys">'+esc(it.sys)+' · <span class="source-tag">'+esc(it.source)+'</span></div>'+
      lobTagsHTML(it)+
      '<div class="tag-row" style="margin-top:4px;">'+relBadgeHTML(it)+'</div>'+
      (it.relNote? '<div class="evidence">Why: '+esc(it.relNote)+'</div>' : '')+
      (it.evidence? '<div class="evidence">'+esc(it.evidence)+'</div>' : '')+
    '</td>'+
    scoreCellHTML(it)+
    '<td><span class="band-pill '+(it.band.css==='unscored'?'unscored':'')+'" '+(it.band.css!=='unscored'? 'style="background:var(--'+it.band.css+'-wash);color:var(--'+it.band.css+')"' : '')+'>'+it.band.label+'</span></td>'+
    '<td>'+exposureBadge(it)+'</td>'+
    '<td><button class="notes-btn '+(hasNote?"has-note":"")+'" data-note-toggle="'+it.id+'">'+(hasNote?"✎ Note":"+ Note")+'</button></td>'+
  '</tr>'+
  '<tr class="note-row '+(open?"":"hidden")+'" data-note-row="'+it.id+'"><td colspan="6">'+
    '<div class="note-box">'+
      '<textarea data-note-input="'+it.id+'" placeholder="Add an audit note — owner, follow-up, data request, quantification status…">'+esc(hasNote?state.notes[it.id].text:"")+'</textarea>'+
      '<div class="note-actions">'+
        '<span class="note-meta">'+(hasNote && state.notes[it.id].updated? "Last saved "+esc(state.notes[it.id].updated) : "Not yet saved")+'</span>'+
        '<span><button class="save-btn" data-note-save="'+it.id+'">Save note</button><span class="save-status" data-save-status="'+it.id+'" style="display:none;">Saved ✓</span></span>'+
      '</div>'+
    '</div>'+
  '</td></tr>';
}

function tableHTML(items){
  return '<div class="scroll-wrap"><table class="reg">'+
    '<thead><tr><th>ID</th><th>Finding · LOB / LOS / relevance</th><th>Score</th><th>Band</th><th>Exposure</th><th>Note</th></tr></thead>'+
    '<tbody>'+items.map(rowHTML).join("")+'</tbody>'+
  '</table></div>';
}

var LOB_DESC = {
  OPD:"Outpatient visits — including chemotherapy/day-care, hemodialysis and medical rehabilitation rolled in as OPD sub-services.",
  IPD:"Inpatient stays — including cath lab and critical care (ICU/ICCU/HCU) rolled in as IPD sub-services.",
  ED:"Emergency Department, triage through transfer/discharge.",
  MCU:"Medical Check-Up.",
  OT:"Operating Theatre.",
  CROSS:"Findings that apply across every setting, or that the source material never split by LOB (radiology, some FC/network items) — placement is directional, not a confirmed single-LOB exposure."
};

function groupsHTML(){
  var groups = state.activeTab==="all" ? LOBS : LOBS.filter(function(g){return g.key===state.activeTab;});
  return groups.map(function(g){
    if(g.items.length===0){
      return '<div class="lob-group">'+
        '<div class="lob-head"><h2>'+esc(g.name)+'</h2><span class="count">0 findings</span></div>'+
        '<div class="empty-state"><strong>Not yet assessed</strong>No SME interview has covered '+esc(g.name)+' yet in this diagnostic round — this is a coverage gap, not a clean bill of health.</div>'+
      '</div>';
    }
    return '<div class="lob-group">'+
      '<div class="lob-head"><h2>'+esc(g.name)+'</h2><span class="count">'+g.items.length+' findings</span></div>'+
      '<p class="lob-desc">'+esc(LOB_DESC[g.key]||"")+'</p>'+
      tableHTML(g.items)+
    '</div>';
  }).join("");
}

function renderApp(){
  var html = ''+
    '<div class="masthead">'+
      '<div><span class="eyebrow">Project ARUS · Phase 1 Diagnostic</span><h1>Revenue Leakage Exposure Map</h1></div>'+
      '<div class="meta">Source: Revenue Leakage Audit Framework, SME &amp; FC interviews (Jun–Sep 2026)<br>'+
        '<strong>Siloam Hospitals Group</strong> · last opened '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'</div>'+
    '</div>'+
    flagHTML()+
    kpiHTML()+
    estimatorHTML()+
    relevanceHTML()+
    distributionHTML()+
    '<div class="panel" style="padding-bottom:6px;">'+
      '<h3 style="margin-bottom:10px;">Leakage register by line of business</h3>'+
      tabsHTML()+
      groupsHTML()+
    '</div>'+
    '<footer>Likelihood × Impact scoring: ≥12 High · 6–11 Moderate · ≤5 Low · Unscored = named as a risk in the source deck but never run through an SME round — no L/I to multiply. '+
      'Relevance tags (Revenue leakage / Adjacent risk / Not revenue leakage) are this pass’s read of each finding, not a re-statement of the source deck. '+
      'Notes are saved to this dashboard for everyone who opens it. Add follow-ups, owners and data requests inline as the quantification pilot progresses.</footer>';
  document.getElementById("app").innerHTML = html;
  wireEvents();
}

function wireEvents(){
  var app = document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(function(el){
    el.addEventListener("click", function(){
      state.activeTab = el.getAttribute("data-tab");
      openNoteId = null;
      renderApp();
    });
  });
  app.querySelectorAll("[data-note-toggle]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-note-toggle");
      openNoteId = (openNoteId === id) ? null : id;
      renderApp();
      if(openNoteId){
        var ta = app.querySelector('[data-note-input="'+cssEscape(openNoteId)+'"]');
        if(ta) ta.focus();
      }
    });
  });
  app.querySelectorAll("[data-note-save]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-note-save");
      var ta = app.querySelector('[data-note-input="'+cssEscape(id)+'"]');
      var text = ta ? ta.value.trim() : "";
      saveNote(id, text, el);
    });
  });
  var calcBtn = app.querySelector("#est-calc");
  if(calcBtn){
    calcBtn.addEventListener("click", function(){ calcEstimate(app); });
  }
  app.querySelectorAll("[data-est-del]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-est-del");
      delete state.estimates[id];
      persistEstimates();
    });
  });
}

function calcEstimate(app){
  var itemId = app.querySelector("#est-item").value || "";
  var label = app.querySelector("#est-label").value.trim();
  var universe = parseFloat(app.querySelector("#est-universe").value);
  var billed = parseFloat(app.querySelector("#est-billed").value);
  var exceptionPct = parseFloat(app.querySelector("#est-exception").value);
  var rate = parseFloat(app.querySelector("#est-rate").value);
  var period = app.querySelector("#est-period").value.trim();
  if(isNaN(exceptionPct)) exceptionPct = 0;

  if(!label || isNaN(universe) || isNaN(billed) || isNaN(rate)){
    var calcBtn = app.querySelector("#est-calc");
    if(calcBtn){
      var orig = calcBtn.textContent;
      calcBtn.textContent = "Need label, universe, billed & rate";
      calcBtn.disabled = true;
      setTimeout(function(){ calcBtn.textContent = orig; calcBtn.disabled = false; }, 2200);
    }
    return;
  }

  var gapVolume = Math.max(0, universe - billed);
  var netGap = gapVolume * (1 - (Math.max(0,Math.min(100,exceptionPct)))/100);
  var exposure = netGap * rate;
  var capturePct = universe > 0 ? Math.round((billed/universe)*1000)/10 : null;
  var now = new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  var id = "est_"+Date.now()+"_"+Math.floor(Math.random()*1000);
  state.estimates[id] = {
    id:id, itemId:itemId, label:label, period:period,
    universe:universe, billed:billed, exceptionPct:exceptionPct,
    rate:rate, gapVolume:gapVolume, capturePct:capturePct, exposure:exposure, updated:now
  };
  persistEstimates();
}

function persistEstimates(){
  renderApp();
  publish();
}

function cssEscape(s){ return s.replace(/([^\w-])/g,"\\$1"); }

function saveNote(id, text, btn){
  btn.disabled = true;
  btn.textContent = "Saving…";
  var now = new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  if(text){
    state.notes[id] = {text:text, updated:now};
  } else {
    delete state.notes[id];
  }
  publish().then(function(ok){
    if(ok){
      var status = document.querySelector('[data-save-status="'+cssEscape(id)+'"]');
      if(status){ status.style.display="inline"; }
      btn.disabled = false;
      btn.textContent = "Save note";
    } else {
      btn.disabled = false;
      btn.textContent = "Save note (retry)";
    }
  });
}

/* ============ PERSISTENCE ============
   IMPORTANT: never read document.head / document.head.innerHTML here. At runtime the served page's
   <head> can carry content this script didn't author (a platform bridge script, live-reload markup,
   injected meta) — copying that verbatim into the republished document is what broke the artifact
   after a note save last time (confirmed: it duplicated a foreign <script> into the next generation,
   which then conflicted with the platform's own re-injection on reload). Build the head from constants
   this script owns instead: the title string below, and this page's own <style id="app-style"> content
   (never anyone else's element). */
var PAGE_TITLE = "ARUS Leakage Exposure Map";
function ownCssText(){
  var el = document.getElementById("app-style");
  return el ? el.textContent : "";
}
function buildFullDocument(){
  var stateJson = JSON.stringify(state).replace(/</g,"\\u003c");
  var css = ownCssText().replace(/<\/style/gi,"<\\/style");
  return '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
    '<title>'+PAGE_TITLE+'</title>\n<style id="app-style">'+css+'</style>\n</head>\n<body>\n'+
    '<div id="app"></div>\n'+
    '<script id="app-state" type="application/json">'+stateJson+'<\/script>\n'+
    '<script>'+SELF_SRC+'<\/script>\n'+
    '</body>\n</html>';
}

var artifactNS = null;
async function getArtifact(){
  if(artifactNS) return artifactNS;
  if(!window.claude || !window.claude.use) return null;
  try{ artifactNS = await window.claude.use("artifact"); }catch(e){ artifactNS = null; }
  return artifactNS;
}

async function publish(){
  if(!SELF_SRC){
    console.warn("Note save aborted: could not capture this page's own script source — refusing to publish a document that would load blank.");
    return false;
  }
  var ns = await getArtifact();
  if(!ns){ return false; }
  try{
    await ns.publish(buildFullDocument());
    return true;
  }catch(e){
    if(e && e.code === "conflict"){ return true; } // view will reload to the winner
    console.warn("Note save failed:", e);
    return false;
  }
}

renderApp();
})();
</script>
